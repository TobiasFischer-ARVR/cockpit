<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1322">
<title>Cockpit</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Intro (Tobias 02.09.): Andreas Logo beim Start. Das Wegschalten muss
     VOR dem Zeichnen passieren, sonst blitzt es kurz auf - deshalb dieses
     eine Inline-Script statt einer Zeile in app.js (die laedt spaeter). -->
<div id="intro" aria-hidden="true">
  <div class="platte">
    <img src="logo.png" alt="Andrea Fischer">
    <i class="strahl"></i>
  </div>
</div>
<script>
try {
  if ((JSON.parse(localStorage.getItem("cockpit-einst") || "{}").intro) === "aus")
    document.getElementById("intro").remove();
} catch (e) {}
</script>
<header>
  <button id="zurueck" aria-label="Zurück">‹</button>
  <h1 id="titel">Cockpit</h1>
  <button id="info" aria-label="Informationen">ⓘ</button>
  <button id="einstellungen" aria-label="Einstellungen">⚙</button>
  <button id="update" aria-label="Daten aktualisieren">↻</button>
</header>
<main id="inhalt"></main>
<script src="msal-browser.min.js"></script>
<!-- JSZip: .docx ist ein ZIP - zum Befuellen der Book-Platzhalter (Phase 6) -->
<script src="jszip.min.js"></script>
<script src="onedrive.js"></script>
<script src="app.js"></script>
</body>
</html>
